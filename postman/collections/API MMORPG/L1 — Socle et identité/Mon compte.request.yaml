$kind: http-request
url: "{{baseUrl}}/api/v1/auth/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200, compte du jeton', () => {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().data.email).to.eql(pm.collectionVariables.get('email'));
      });
    language: text/javascript
order: 6000
