$kind: http-request
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 UP', () => {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().data.status).to.eql('UP');
      });
      pm.test('X-Request-Id renvoyé', () => pm.response.to.have.header('X-Request-Id'));
    language: text/javascript
order: 1000
