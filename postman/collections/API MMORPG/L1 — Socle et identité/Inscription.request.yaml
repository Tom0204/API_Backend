$kind: http-request
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('email', `player.${Date.now()}.l1@example.com`);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('201, ni mot de passe ni hash', () => {
          pm.response.to.have.status(201);
          const data = pm.response.json().data;
          pm.expect(Object.keys(data)).to.have.members(['id', 'email', 'createdAt']);
      });
    language: text/javascript
order: 2000
