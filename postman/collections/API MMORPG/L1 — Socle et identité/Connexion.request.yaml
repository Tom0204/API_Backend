$kind: http-request
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200, jeton Bearer', () => {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().data.tokenType).to.eql('Bearer');
      });
      pm.collectionVariables.set('token', pm.response.json().data.token);
    language: text/javascript
order: 4000
