$kind: http-request
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('409 EMAIL_ALREADY_USED', () => {
          pm.response.to.have.status(409);
          pm.expect(pm.response.json().error.code).to.eql('EMAIL_ALREADY_USED');
      });
    language: text/javascript
order: 3000
