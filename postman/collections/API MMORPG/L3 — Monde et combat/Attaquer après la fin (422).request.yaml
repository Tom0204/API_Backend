$kind: http-request
url: "{{baseUrl}}/api/v1/combats/{{combatId}}/actions"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "type": "ATTACK"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('422 COMBAT_FINISHED', () => {
          pm.response.to.have.status(422);
          pm.expect(pm.response.json().error.code).to.eql('COMBAT_FINISHED');
      });
    language: text/javascript
order: 7000
