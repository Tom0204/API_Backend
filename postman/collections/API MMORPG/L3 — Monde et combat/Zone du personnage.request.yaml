$kind: http-request
url: "{{baseUrl}}/api/v1/characters/{{characterId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('zoneId', pm.response.json().data.zoneId);
    language: text/javascript
order: 1000
