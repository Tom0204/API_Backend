$kind: http-request
url: "{{baseUrl}}/api/v1/combats"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "characterId": "{{characterId}}",
      "monsterId": "{{monsterId}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('409 CHARACTER_ALREADY_IN_COMBAT', () => {
          pm.response.to.have.status(409);
          pm.expect(pm.response.json().error.code).to.eql('CHARACTER_ALREADY_IN_COMBAT');
      });
    language: text/javascript
order: 4000
