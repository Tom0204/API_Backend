$kind: http-request
url: "{{baseUrl}}/api/v1/characters/{{mageCharacterId}}/stats"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200, niveau 1, 0 XP, PV de nouveau au maximum', () => {
          pm.response.to.have.status(200);
          const data = pm.response.json().data;
          pm.expect(data.level).to.eql(1);
          pm.expect(data.experience).to.eql(0);
          pm.expect(data.stats.currentHp).to.eql(data.stats.maxHp);
      });
    language: text/javascript
order: 7000
