$kind: http-request
url: "{{baseUrl}}/api/v1/characters/{{mageCharacterId}}/inventory"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200, inventaire vide', () => {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().data).to.eql([]);
      });
    language: text/javascript
order: 8000
