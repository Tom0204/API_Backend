$kind: http-request
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{otherEmail}}",
      "password": "{{password}}"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('otherEmail', `other.${Date.now()}.l2@example.com`);
    language: text/javascript
  - type: afterResponse
    code: pm.test('201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 7000
