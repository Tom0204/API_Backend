$kind: http-request
url: "{{baseUrl}}/api/v1/characters"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Cheater",
      "classId": "{{classId}}",
      "level": 10
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 VALIDATION_ERROR', () => {
          pm.response.to.have.status(400);
          pm.expect(pm.response.json().error.code).to.eql('VALIDATION_ERROR');
      });
    language: text/javascript
order: 3000
