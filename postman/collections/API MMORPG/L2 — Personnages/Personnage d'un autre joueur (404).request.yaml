$kind: http-request
url: "{{baseUrl}}/api/v1/characters/{{characterId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{otherToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 CHARACTER_NOT_FOUND', () => {
          pm.response.to.have.status(404);
          pm.expect(pm.response.json().error.code).to.eql('CHARACTER_NOT_FOUND');
      });
    language: text/javascript
order: 9000
